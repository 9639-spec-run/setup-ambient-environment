<svg width="2700px" height="1500px" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttlG descG">
  <title id="ttlG">目標とするセットアップ：正本参照・役割分担・承認ゲート</title>
  <desc id="descG">上部にSourceOfTruth（丸）、その下にHermes・Claude Code・Coworkの3つの四角が並び、点線でSourceOfTruthを参照する。HermesからClaude Codeへ委譲の矢印、Claude Codeから承認ゲートへ矢印、承認ゲートからSourceOfTruthへ書き戻しの点線矢印、承認ゲートから副作用のある操作へ矢印が伸びる。</desc>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B73"/>
    </marker>
    <marker id="arrowGT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7C86"/>
    </marker>
  </defs>

  <!-- SourceOfTruth -->
  <ellipse cx="380" cy="70" rx="230" ry="55" fill="#F1F6F7" stroke="#0F2742" stroke-width="2.5"/>
  <text x="380" y="65" text-anchor="middle" font-size="17" font-weight="700" fill="#0F2742" font-family="sans-serif">SourceOfTruth</text>
  <text x="380" y="87" text-anchor="middle" font-size="12" fill="#5B6B73" font-family="sans-serif">memory ・ skills ・ profile — 二重化しない正本</text>

  <!-- reference dashed lines from 3 boxes up to SOT -->
  <line x1="150" y1="180" x2="320" y2="118" stroke="#CFE0EE" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <line x1="380" y1="180" x2="380" y2="128" stroke="#CFE0EE" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <line x1="610" y1="180" x2="450" y2="118" stroke="#CFE0EE" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <text x="140" y="150" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">参照</text>
  <text x="396" y="152" font-size="10.5" fill="#5B6B73" font-family="sans-serif">参照</text>
  <text x="590" y="150" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">参照</text>

  <!-- three boxes -->
  <rect x="60" y="182" width="180" height="68" rx="8" fill="#FFFFFF" stroke="#3E5C76" stroke-width="2"/>
  <text x="150" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2742" font-family="sans-serif">Hermes</text>
  <text x="150" y="229" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">指揮層・無人常駐</text>
  <text x="150" y="243" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">cron / 提案の起点</text>

  <rect x="290" y="182" width="180" height="68" rx="8" fill="#FFFFFF" stroke="#3E5C76" stroke-width="2"/>
  <text x="380" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2742" font-family="sans-serif">Claude Code</text>
  <text x="380" y="229" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">実行層・実作業</text>
  <text x="380" y="243" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">CLAUDE.md @import</text>

  <rect x="520" y="182" width="180" height="68" rx="8" fill="#FFFFFF" stroke="#3E5C76" stroke-width="2"/>
  <text x="610" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2742" font-family="sans-serif">Cowork</text>
  <text x="610" y="229" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">有人作業・成果物</text>
  <text x="610" y="243" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">本スライド作成もこの一部</text>

  <!-- Hermes delegate to Claude Code -->
  <line x1="240" y1="216" x2="288" y2="216" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="264" y="205" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">委譲</text>

  <!-- Claude Code down to Gate -->
  <line x1="380" y1="250" x2="380" y2="300" stroke="#0F2742" stroke-width="2.5" marker-end="url(#arrowGT)"/>

  <!-- Approval gate -->
  <rect x="255" y="302" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#0E7C86" stroke-width="2.5"/>
  <text x="380" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7C86" font-family="sans-serif">承認ゲート（人間）</text>
  <text x="380" y="350" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">副作用・記憶更新の前に必ず通す</text>
  <text x="380" y="366" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">review.py ／ approval_core.py</text>

  <!-- Gate -> write back to SOT (loop, dashed, left side) -->
  <path d="M255,340 C25,340 25,72 152,72" fill="none" stroke="#0E7C86" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGT)"/>
  <text x="42" y="220" text-anchor="middle" font-size="10.5" fill="#0E7C86" font-family="sans-serif" transform="rotate(-90 42 220)">承認後に正本へ書き戻し</text>

  <!-- Gate -> side effects (right) -->
  <line x1="505" y1="342" x2="600" y2="342" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="602" y="305" width="220" height="75" rx="8" fill="#F1F6F7" stroke="#5B6B73" stroke-width="1.5"/>
  <text x="712" y="330" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F2742" font-family="sans-serif">副作用のある操作</text>
  <text x="712" y="349" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">公開 ・ 送信 ・ 削除</text>
  <text x="712" y="364" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">git push ・ 課金</text>

  <!-- bottom note -->
  <rect x="60" y="415" width="762" height="62" rx="8" fill="#F1F6F7" stroke="#CFE0EE" stroke-width="1.5"/>
  <text x="441" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F2742" font-family="sans-serif">貫く原則</text>
  <text x="441" y="460" text-anchor="middle" font-size="11" fill="#5B6B73" font-family="sans-serif">①正本は一元化し複製しない　②安全はプロンプトでなくコードで強制　③判断・副作用の前に人間を挟む</text>
</svg>
