<svg width="2700px" height="1680px" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttlM descM">
  <title id="ttlM">大規模データのRAG・MCPサーバー化：Claude Codeから読み取り専用ツールとして呼び出す構成</title>
  <desc id="descM">上部にClaude Code/Claude Desktop、その下にprivate-search-engineとproject-ragの2つのMCPサーバー、さらにその下に各バックエンドAPI/検索処理、最下段にPostgreSQL+pgvectorのDBが並ぶ。一番下に読み取り専用ツールのみ公開する設計原則の注記。</desc>
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B73"/>
    </marker>
  </defs>

  <!-- Row1: Claude -->
  <rect x="300" y="20" width="300" height="62" rx="8" fill="#FFFFFF" stroke="#3E5C76" stroke-width="2"/>
  <text x="450" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2742" font-family="sans-serif">Claude Code / Claude Desktop</text>
  <text x="450" y="68" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">MCPクライアントとして呼び出す</text>

  <!-- arrows Claude -> MCP boxes -->
  <path d="M380,82 L235,118" fill="none" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowM)"/>
  <path d="M520,82 L665,118" fill="none" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowM)"/>

  <!-- Row2: MCP servers -->
  <rect x="40" y="120" width="350" height="72" rx="8" fill="#F1F6F7" stroke="#3E5C76" stroke-width="2"/>
  <text x="215" y="147" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2742" font-family="sans-serif">private-search-engine（MCP server）</text>
  <text x="215" y="166" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">search_memory / filter_by_taxonomy</text>
  <text x="215" y="182" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">（読み取り専用ツールのみ公開）</text>

  <rect x="510" y="120" width="350" height="72" rx="8" fill="#F1F6F7" stroke="#3E5C76" stroke-width="2"/>
  <text x="685" y="147" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2742" font-family="sans-serif">project-rag（MCP server）</text>
  <text x="685" y="166" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">search_projects</text>
  <text x="685" y="182" text-anchor="middle" font-size="10.5" fill="#5B6B73" font-family="sans-serif">（読み取り専用ツールのみ公開）</text>

  <!-- arrows MCP -> backend -->
  <line x1="215" y1="192" x2="215" y2="228" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowM)"/>
  <line x1="685" y1="192" x2="685" y2="228" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowM)"/>

  <!-- Row3: backend logic -->
  <rect x="40" y="230" width="350" height="58" rx="8" fill="#FFFFFF" stroke="#5B6B73" stroke-width="1.5"/>
  <text x="215" y="254" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F2742" font-family="sans-serif">PSE API（FastAPI :8007）</text>
  <text x="215" y="272" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">意図・役割・関心カテゴリで分類済み</text>

  <rect x="510" y="230" width="350" height="58" rx="8" fill="#FFFFFF" stroke="#5B6B73" stroke-width="1.5"/>
  <text x="685" y="254" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F2742" font-family="sans-serif">retrieve.py（ハイブリッド検索）</text>
  <text x="685" y="272" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">Ollama bge-m3 埋め込み</text>

  <!-- arrows backend -> DB -->
  <line x1="215" y1="288" x2="215" y2="320" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowM)"/>
  <line x1="685" y1="288" x2="685" y2="320" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowM)"/>

  <!-- Row4: DB -->
  <ellipse cx="215" cy="375" rx="188" ry="58" fill="#FFFFFF" stroke="#0F2742" stroke-width="2.5"/>
  <text x="215" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F2742" font-family="sans-serif">PostgreSQL + pgvector + ltree</text>
  <text x="215" y="386" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">会話履歴（PSE）</text>
  <text x="215" y="401" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">意図・役割・関心カテゴリで分類</text>

  <ellipse cx="685" cy="375" rx="188" ry="58" fill="#FFFFFF" stroke="#0F2742" stroke-width="2.5"/>
  <text x="685" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F2742" font-family="sans-serif">PostgreSQL + pgvector</text>
  <text x="685" y="386" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">~/projects配下のmd/txtのみを索引</text>
  <text x="685" y="401" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">（コードはgrep/直接読込に委ねて除外）</text>

  <!-- bottom principle note -->
  <rect x="60" y="465" width="780" height="76" rx="8" fill="#F1F6F7" stroke="#CFE0EE" stroke-width="1.5"/>
  <text x="450" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E7C86" font-family="sans-serif">読み取り専用ツールのみ公開</text>
  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#5B6B73" font-family="sans-serif">reindex・ingest・syncなど書込み系はMCPに出さない</text>
  <text x="450" y="527" text-anchor="middle" font-size="11" fill="#5B6B73" font-family="sans-serif">— 承認ゲート（人間）と同じ最小権限の設計思想</text>
</svg>
