<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttlM2 descM2">
  <title id="ttlM2">memoryの投影 詳細図（データ＝丸・処理＝四角）</title>
  <desc id="descM2">memory/shared正本のfacts・context・projects（丸）がcore.md（丸）に集約される。core.mdから4方向に分岐し、Claude Codeには@import（四角）、claude.aiには手動貼付（四角）、Hermesにはpost-commit hook経由gen_hermes_user.py（四角）でUSER.md生成、Coworkには未整備の手動投影（四角・破線）で届く。</desc>
