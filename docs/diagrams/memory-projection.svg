        --surface-0: #FFFFFF;
        --surface-1: #F1EFE8;
        --surface-2: #EAE8E0;
        --border: #D8D5CC;
        --border-strong: #B5B2A8;
        --border-stronger: #8A8880;
        --bg: #FBFAF7;
        --bg2: #F1EFE8;
      }
    </style>
    <marker id="arrowM2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
