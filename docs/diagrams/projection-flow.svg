<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttlA descA">
  <title id="ttlA">SourceOfTruthからAIアシスタント群への投影フロー図（3列構成）</title>
  <desc id="descA">中央列に、上から四角で囲まれたAIアシスタント群、上向き矢印で投影、丸で囲まれたSourceOfTruth（memoryとskills）が縦に並ぶ。その左側にmemory投影に必要な資産一式、右側にskills投影に必要な資産一式の縦長ボックスが、中央列と同じ高さで配置されている。</desc>
  <defs>
    <style>
      :root {
        --text-primary: #2C2C2A;
        --text-secondary: #5F5E5A;
        --text-accent: #185FA5;
        --text-muted: #8A8880;
        --surface-0: #FFFFFF;
        --surface-1: #F1EFE8;
        --surface-2: #EAE8E0;
        --border: #D8D5CC;
        --border-strong: #B5B2A8;
        --border-stronger: #8A8880;
        --bg: #FBFAF7;
        --bg2: #F1EFE8;
      }
    </style>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B73"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="180" height="375" rx="6" fill="#FFFFFF" stroke="#3E5C76" stroke-width="2"/>
  <text x="110" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#0F2742" font-family="sans-serif">memory投影に必要な</text>
  <text x="110" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#0F2742" font-family="sans-serif">資産一式</text>
  <line x1="35" y1="140" x2="185" y2="140" stroke="#CFE0EE" stroke-width="1"/>
  <text x="35" y="164" font-size="11" fill="#5B6B73" font-family="monospace">post-commit hook</text>
  <text x="35" y="194" font-size="11" fill="#5B6B73" font-family="monospace">tools/</text>
  <text x="35" y="224" font-size="11" fill="#5B6B73" font-family="monospace">scripts/</text>
  <text x="35" y="240" font-size="11" fill="#5B6B73" font-family="monospace">gen_hermes_user.py</text>
  <text x="35" y="270" font-size="11" fill="#5B6B73" font-family="monospace">gen_profile_yaml.py</text>
  <rect x="620" y="20" width="180" height="375" rx="6" fill="#FFFFFF" stroke="#3E5C76" stroke-width="2"/>
  <text x="710" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#0F2742" font-family="sans-serif">skills投影に必要な</text>
  <text x="710" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#0F2742" font-family="sans-serif">資産一式</text>
  <line x1="635" y1="140" x2="785" y2="140" stroke="#CFE0EE" stroke-width="1"/>
  <text x="635" y="164" font-size="11" fill="#5B6B73" font-family="monospace">requirements.yaml</text>
  <text x="635" y="194" font-size="11" fill="#5B6B73" font-family="monospace">assignments.yaml</text>
  <text x="635" y="224" font-size="11" fill="#5B6B73" font-family="monospace">eligible-sources.yaml</text>
  <text x="635" y="254" font-size="11" fill="#5B6B73" font-family="monospace">deliver.py</text>
  <line x1="410" y1="205" x2="410" y2="122" stroke="#5B6B73" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="426" y="168" font-size="13" fill="#0E7C86" font-family="sans-serif">投影</text>
  <rect x="220" y="20" width="380" height="100" rx="6" fill="#F1F6F7" stroke="#3E5C76" stroke-width="2"/>
  <text x="410" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#0F2742" font-family="sans-serif">AIアシスタント群</text>
  <rect x="235" y="48" width="77" height="58" rx="4" fill="#FFFFFF" stroke="#CFE0EE" stroke-width="1.5"/>
  <text x="273.5" y="80" text-anchor="middle" font-size="11" fill="#0F2742" font-family="sans-serif">Claude Code</text>
  <rect x="326" y="48" width="77" height="58" rx="4" fill="#FFFFFF" stroke="#CFE0EE" stroke-width="1.5"/>
  <text x="364.5" y="80" text-anchor="middle" font-size="11" fill="#0F2742" font-family="sans-serif">claude.ai</text>
  <rect x="417" y="48" width="77" height="58" rx="4" fill="#FFFFFF" stroke="#CFE0EE" stroke-width="1.5"/>
  <text x="455.5" y="80" text-anchor="middle" font-size="11" fill="#0F2742" font-family="sans-serif">Hermes</text>
  <rect x="508" y="48" width="77" height="58" rx="4" fill="#FFFFFF" stroke="#CFE0EE" stroke-width="1.5"/>
  <text x="546.5" y="80" text-anchor="middle" font-size="11" fill="#0F2742" font-family="sans-serif">Cowork</text>
  <ellipse cx="410" cy="300" rx="190" ry="95" fill="#F1F6F7" stroke="#3E5C76" stroke-width="2"/>
  <text x="410" y="235" text-anchor="middle" font-size="13" font-weight="600" fill="#0F2742" font-family="sans-serif">SourceOfTruth</text>
  <line x1="410" y1="255" x2="410" y2="365" stroke="#CFE0EE" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="330" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#0F2742" font-family="sans-serif">memory</text>
  <text x="330" y="300" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">shared/facts・context</text>
  <text x="330" y="316" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">projects・core.md</text>
  <text x="490" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#0F2742" font-family="sans-serif">skills</text>
  <text x="490" y="300" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">core・dev・content</text>
  <text x="490" y="316" text-anchor="middle" font-size="10" fill="#5B6B73" font-family="sans-serif">researcher・recruiting</text>
</svg>
